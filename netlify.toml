[build]
  command = "npm run build"
  publish = "dist"

# Admin panel — /admin en /admin/ sturen naar de statische admin/index.html
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

[functions."keepalive"]
  schedule = "0 3 */5 * *"

# SPA catch-all — staat bewust NA de /admin redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
